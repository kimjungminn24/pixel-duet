name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { os: linux, arch: amd64 }
          - { os: linux, arch: arm64 }
          - { os: darwin, arch: amd64 }
          - { os: darwin, arch: arm64 }
          - { os: windows, arch: amd64 }
          - { os: windows, arch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          ext=""
          [ "$GOOS" = windows ] && ext=.exe
          out="pixelduet-$GOOS-$GOARCH$ext"
          go build -trimpath -ldflags "-s -w -X main.version=$GITHUB_REF_NAME" -o "$out" .
          sha256sum "$out" > "$out.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: pixelduet-${{ matrix.os }}-${{ matrix.arch }}
          path: pixelduet-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  # Publishes through npm Trusted Publishing (OIDC): no token, no 2FA bypass.
  # Configure once on npmjs.com under the package: Settings > Trusted Publisher >
  # GitHub Actions, repository kimjungminn24/pixel-duet, workflow release.yml.
  npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - name: publish
        working-directory: npm
        run: |
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
          npm publish --access public

  # Lists the server in the MCP Registry once npm has the version it points to.
  # GitHub OIDC proves ownership of io.github.kimjungminn24/*, and the registry
  # checks mcpName in npm/package.json against the name in server.json.
  mcp-registry:
    needs: npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: install mcp-publisher
        run: |
          set -euo pipefail
          archive=mcp-publisher_linux_amd64.tar.gz
          base=https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION
          curl -fsSL -o "$archive" "$base/$archive"
          curl -fsSL -o "$archive.sigstore.json" "$base/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/$MCP_PUBLISHER_VERSION" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$archive"
          tar xzf "$archive" mcp-publisher
      - name: publish
        run: |
          v="${GITHUB_REF_NAME#v}"
          jq --arg v "$v" '.version = $v | .packages[0].version = $v' server.json > server.tmp
          mv server.tmp server.json
          # npm takes a few minutes to serve a new version, and the registry checks it is there.
          for i in $(seq 1 30); do
            curl -fs -o /dev/null "https://registry.npmjs.org/pixelduet/$v" && break
            sleep 20
          done
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
